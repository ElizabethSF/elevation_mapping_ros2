grid_map_visualization:
  ros__parameters:

    grid_map_visualizations: ["elevation_cloud", "upper_bound_cloud", "lower_bound_cloud", "map_region"]

    grid_map_visualizations.elevation_cloud.name: elevation_cloud
    grid_map_visualizations.elevation_cloud.type: point_cloud
    grid_map_visualizations.elevation_cloud.params.layer: elevation

    grid_map_visualizations.upper_bound_cloud.name: upper_bound_cloud
    grid_map_visualizations.upper_bound_cloud.type: point_cloud
    grid_map_visualizations.upper_bound_cloud.params.layer: upper_bound

    grid_map_visualizations.lower_bound_cloud.name: lower_bound_cloud
    grid_map_visualizations.lower_bound_cloud.type: point_cloud
    grid_map_visualizations.lower_bound_cloud.params.layer: lower_bound

    grid_map_visualizations.map_region.name: map_region
    grid_map_visualizations.map_region.type: map_region
    grid_map_visualizations.map_region.params.color: 16777215
    grid_map_visualizations.map_region.params.line_width: 0.003
